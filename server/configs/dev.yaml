app:
  name: dlidli-api
  env: dev
  port: 8000
  # 审核工作台已上线：走真实"先审后播"，在 /admin/review 人工过审
  autoApprove: false
  # 内测邀请码注册开关（ACC-44，M1-REL-04；默认关闭，内测期可开）
  inviteCodeRequired: false
  allowOrigins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:5175 # apps/admin 管理后台

log:
  level: debug

mysql:
  # 对齐 deploy/docker-compose.yaml 的 mysql 映射（3306:3306，密码 dlidli123）
  dsn: "root:dlidli123@tcp(127.0.0.1:3306)/dlidli?charset=utf8mb4&parseTime=True&loc=Local"
  maxOpenConns: 50
  maxIdleConns: 10

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  # 生产环境必须通过环境变量 DLIDLI_JWT_SECRET 覆盖
  secret: "dev-secret-do-not-use-in-prod"
  accessTtlMin: 120

ratelimit:
  enabled: true
  perMinute: 30

storage:
  driver: local
  localDir: ./uploads
  baseUrl: http://localhost:8000/static

transcode:
  enabled: true
  workers: 1
  # ffmpeg/ffprobe 缺省走 PATH；特殊环境用环境变量覆盖：
  #   DLIDLI_TRANSCODE_FFMPEGPATH / DLIDLI_TRANSCODE_FFPROBEPATH

# 微信公众号（H5 JSSDK）与小程序凭据均建议用环境变量注入。
# DLIDLI_WECHAT_APPID / DLIDLI_WECHAT_APPSECRET
# DLIDLI_WECHAT_MPAPPID / DLIDLI_WECHAT_MPAPPSECRET
wechat:
  appId: ""
  appSecret: ""
  mpAppId: ""
  mpAppSecret: ""

# OpenTelemetry（M3-ENG-04）：为空时关闭 OTLP 导出；可用环境变量覆盖。
# tracing:
#   endpoint: http://127.0.0.1:4318
#   serviceName: dlidli-api

# 搜索索引（M2-SRH-01/02）：esUrl 配置后启用 ES 检索与索引同步 Worker，
# 未配置时搜索自动降级 MySQL LIKE（本机无 ES 时保持注释即可）。
# search:
#   esUrl: http://127.0.0.1:9200
#   index: dlidli_videos
#   pollSeconds: 3
#   batchSize: 100

# 直播域（M4-LIV-01/02）：推拉流寻址 + SRS http_hooks 回调鉴权。
# 可用环境变量覆盖：DLIDLI_LIVE_PUSHDOMAIN / DLIDLI_LIVE_PLAYDOMAIN /
# DLIDLI_LIVE_STREAMAPP / DLIDLI_LIVE_CALLBACKTOKEN
live:
  pushDomain: 127.0.0.1:1935 # SRS RTMP 监听
  playDomain: 127.0.0.1:8180 # SRS HTTP 服务（HLS/HTTP-FLV；8080 本机有出站占用，改用 8180）
  streamApp: live
  # dev 固定 token，仅供本机 SRS/替代服务器配置对齐；生产用密钥注入（见 deploy/srs/README.md）
  callbackToken: dev-live-cb-token
  # 截帧机审与快速切断（M4-LIV-05，spec §5E / plan §2D）。
  # enabled 默认 false：机审会周期拉起 ffmpeg 拉流截帧，默认关闭避免影响其它测试；
  # 联调/验收时改为 true（或用 DLIDLI_LIVE_AUDIT_ENABLED=true 覆盖）。
  # 错误码：91027 机审未启用 / 91028 房间已被封禁 / 91029 房间未被封禁 / 91030 无推流。
  audit:
    enabled: false
    frameIntervalSeconds: 10 # spec §3 硬要求：每 10s 截帧
    flvTimeoutSeconds: 15 # 单房间截帧超时（ffmpeg 挂死兜底）
    srsApiBase: http://127.0.0.1:1985 # SRS HTTP API（查流/踢流）；1985 为内网运维端口
    frameDir: ./uploads/live-frames # 截帧图落盘目录（合规存档，spec §4）
    # 画面低信息量判据（plan §2D.5 实测标定：纯黑 YAVG=0；testsrc 正常帧 YAVG=127.5）
    blackYAvgMax: 24 # 灰度均值 ≤ 24 判为黑屏
    flatRangeMax: 12 # YMAX-YMIN ≤ 12 判为纯色遮挡

# 支付域（M4-PAY-01，spec §6 / plan §2E）。
# 资质现实：真实支付宝/微信需要支付通道资质，当前不具备 —— 只有 mock 渠道可跑通全链路，
# alipay/wechat 为换入点（调用返回 92004「渠道未实现」，接入步骤见 internal/module/pay/alipay.go）。
# 可用环境变量覆盖：DLIDLI_PAY_ORDERTIMEOUTMINUTES / DLIDLI_PAY_STUCKHOURS /
# DLIDLI_PAY_MOCKSECRET / DLIDLI_PAY_MAXAMOUNT / DLIDLI_PAY_NOTIFYURLBASE
pay:
  orderTimeoutMinutes: 15 # 订单支付超时（分钟）；过期由惰性关单置为「已关闭」
  stuckHours: 24 # 对账「长期挂起」阈值（小时）
  # dev 固定 mock 密钥（回调验签 HMAC-SHA256）；prod 必须用环境变量注入，否则启动即失败
  mockSecret: dev-mock-pay-secret-do-not-use-in-prod
  maxAmount: 1000000 # 单笔上限（分，即 1 万元）；防把「元」当「分」误传
  notifyURLBase: http://localhost:8000 # 渠道异步回调地址前缀

