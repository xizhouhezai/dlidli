app:
  name: dlidli-api
  env: dev
  port: 8000
  # 审核工作台已上线：走真实"先审后播"，在 /admin/review 人工过审
  autoApprove: false
  # 内测邀请码注册开关（ACC-44，M1-REL-04；默认关闭，内测期可开）
  inviteCodeRequired: false
  allowOrigins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:5175 # apps/admin 管理后台

log:
  level: debug

mysql:
  dsn: "root:root@tcp(127.0.0.1:3307)/dlidli?charset=utf8mb4&parseTime=True&loc=Local"
  maxOpenConns: 50
  maxIdleConns: 10

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  # 生产环境必须通过环境变量 DLIDLI_JWT_SECRET 覆盖
  secret: "dev-secret-do-not-use-in-prod"
  accessTtlMin: 120

ratelimit:
  enabled: true
  perMinute: 30

storage:
  driver: local
  localDir: ./uploads
  baseUrl: http://localhost:8000/static

transcode:
  enabled: true
  workers: 1
  # ffmpeg/ffprobe 缺省走 PATH；特殊环境用环境变量覆盖：
  #   DLIDLI_TRANSCODE_FFMPEGPATH / DLIDLI_TRANSCODE_FFPROBEPATH

# 微信公众号（H5 JSSDK）与小程序凭据均建议用环境变量注入。
# DLIDLI_WECHAT_APPID / DLIDLI_WECHAT_APPSECRET
# DLIDLI_WECHAT_MPAPPID / DLIDLI_WECHAT_MPAPPSECRET
wechat:
  appId: ""
  appSecret: ""
  mpAppId: ""
  mpAppSecret: ""

# 搜索索引（M2-SRH-01/02）：esUrl 配置后启用 ES 检索与索引同步 Worker，
# 未配置时搜索自动降级 MySQL LIKE（本机无 ES 时保持注释即可）。
# search:
#   esUrl: http://127.0.0.1:9200
#   index: dlidli_videos
#   pollSeconds: 3
#   batchSize: 100

