app:
  name: dlidli-api
  env: dev
  port: 8000
  # 审核工作台已上线：走真实"先审后播"，在 /admin/review 人工过审
  autoApprove: false
  # 内测邀请码注册开关（ACC-44，M1-REL-04；默认关闭，内测期可开）
  inviteCodeRequired: false
  allowOrigins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:5175 # apps/admin 管理后台
    - http://localhost:5176 # apps/h5 移动端 H5
    # 鸿蒙 App（ArkTS）开发/联调：@ohos.net.webSocket 自生成 Origin，默认形态为
    # `http://<host>`（不带端口，connect() 的同名 header 覆盖不掉），API 26 起可用
    # `supportOriginPort: true` 让它带端口。模拟器访问宿主机用 10.0.2.2/127.0.0.1。
    - http://127.0.0.1
    - http://10.0.2.2
    - http://localhost
  # 非浏览器客户端（鸿蒙 ArkTS / 原生 App）：Origin 不在白名单时，若请求携带
  # 经 JWT 校验有效的 access token（?token= 或 Authorization 头）则放行该次 WS 握手。
  # 浏览器白名单防护不受影响：浏览器强制设置 Origin，恶意页面拿不到受害者的 token。
  # prod 是否开启见 configs/prod.yaml 的运维说明。
  allowNativeClients: true

log:
  level: debug

mysql:
  # 对齐 deploy/docker-compose.yaml 的 mysql 映射（3306:3306，密码 dlidli123）
  dsn: "root:dlidli123@tcp(127.0.0.1:3306)/dlidli?charset=utf8mb4&parseTime=True&loc=Local"
  maxOpenConns: 50
  maxIdleConns: 10

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  # 生产环境必须通过环境变量 DLIDLI_JWT_SECRET 覆盖
  secret: "dev-secret-do-not-use-in-prod"
  accessTtlMin: 120

ratelimit:
  enabled: true
  perMinute: 30

storage:
  driver: local
  localDir: ./uploads
  baseUrl: http://localhost:8000/static

transcode:
  enabled: true
  workers: 1
  # ffmpeg/ffprobe 缺省走 PATH；特殊环境用环境变量覆盖：
  #   DLIDLI_TRANSCODE_FFMPEGPATH / DLIDLI_TRANSCODE_FFPROBEPATH

# 微信公众号（H5 JSSDK）与小程序凭据均建议用环境变量注入。
# DLIDLI_WECHAT_APPID / DLIDLI_WECHAT_APPSECRET
# DLIDLI_WECHAT_MPAPPID / DLIDLI_WECHAT_MPAPPSECRET
wechat:
  appId: ""
  appSecret: ""
  mpAppId: ""
  mpAppSecret: ""

# OpenTelemetry（M3-ENG-04）：为空时关闭 OTLP 导出；可用环境变量覆盖。
# tracing:
#   endpoint: http://127.0.0.1:4318
#   serviceName: dlidli-api

# 搜索索引（M2-SRH-01/02）：esUrl 配置后启用 ES 检索与索引同步 Worker，
# 未配置时搜索自动降级 MySQL LIKE（本机无 ES 时保持注释即可）。
# search:
#   esUrl: http://127.0.0.1:9200
#   index: dlidli_videos
#   pollSeconds: 3
#   batchSize: 100

# 直播域（M4-LIV-01/02）：推拉流寻址 + SRS http_hooks 回调鉴权。
# 可用环境变量覆盖：DLIDLI_LIVE_PUSHDOMAIN / DLIDLI_LIVE_PLAYDOMAIN /
# DLIDLI_LIVE_STREAMAPP / DLIDLI_LIVE_CALLBACKTOKEN
live:
  pushDomain: 127.0.0.1:1935 # SRS RTMP 监听
  playDomain: 127.0.0.1:8180 # SRS HTTP 服务（HLS/HTTP-FLV；8080 本机有出站占用，改用 8180）
  streamApp: live
  # dev 固定 token，仅供本机 SRS/替代服务器配置对齐；生产用密钥注入（见 deploy/srs/README.md）
  callbackToken: dev-live-cb-token
  # 截帧机审与快速切断（M4-LIV-05，spec §5E / plan §2D）。
  # enabled 默认 false：机审会周期拉起 ffmpeg 拉流截帧，默认关闭避免影响其它测试；
  # 联调/验收时改为 true（或用 DLIDLI_LIVE_AUDIT_ENABLED=true 覆盖）。
  # 错误码：91027 机审未启用 / 91028 房间已被封禁 / 91029 房间未被封禁 / 91030 无推流。
  audit:
    enabled: false
    frameIntervalSeconds: 10 # spec §3 硬要求：每 10s 截帧
    flvTimeoutSeconds: 15 # 单房间截帧超时（ffmpeg 挂死兜底）
    srsApiBase: http://127.0.0.1:1985 # SRS HTTP API（查流/踢流）；1985 为内网运维端口
    frameDir: ./uploads/live-frames # 截帧图落盘目录（合规存档，spec §4）
    # 画面低信息量判据（plan §2D.5 实测标定：纯黑 YAVG=0；testsrc 正常帧 YAVG=127.5）
    blackYAvgMax: 24 # 灰度均值 ≤ 24 判为黑屏
    flatRangeMax: 12 # YMAX-YMIN ≤ 12 判为纯色遮挡

  # 直播回放（M4-LIV-14，spec LIV-14 / plan liv14）。
  # **两个开关默认关闭**：录制按分钟产生几十 MB 文件，自动生成还会占转码 CPU 并往稿件列表塞草稿，
  # 每次联调都开着会污染其它测试（与 live.audit.enabled / vip.renewEnabled 同一口径）。
  # 验收/联调时打开：DLIDLI_LIVE_REPLAY_ENABLED=true DLIDLI_LIVE_REPLAY_AUTOGENERATE=true
  # 错误码：91031 回放未启用 / 91032 回放不存在或不属于您 / 91033 重复发布 / 91034 超时长上限。
  replay:
    enabled: false # 回放总开关（SRS DVR 录制 + 素材登记 + 保留期清理）
    autoGenerate: false # 下播后自动转码生成草稿稿件；关=仅登记素材，可事后手动补生成
    # SRS DVR 落盘目录（宿主路径）—— 必须与 deploy/srs/docker-compose.srs.yaml 的
    # `./dvr:/data/dvr` bind mount 指向同一份宿主目录，否则后端找不到录制文件。
    dvrDir: ./deploy/srs/dvr
    # 单场直播录制时长上限（小时）：超限则拒绝生成并登记原因。
    # 依据：整段直播是**一次性转码源**，4 小时 1080p 直播的 FLV 约 10-25GB，
    # 超过后单机转码的时延与磁盘占用都不可控（plan liv14 D2）。
    maxDurationHours: 4
    # 录制文件保留天数（spec §4 合规：直播内容存档 ≥60 天，不得配更小）。
    # 清理任务删除的是**录制文件**；稿件与登记行保留以维追溯（plan liv14 §3.5）。
    retentionDays: 60
    cleanIntervalSeconds: 3600 # 保留期清理扫描周期（秒）
    categoryID: 0 # 回放稿件分区；0 = 取第一个启用分区（回放是自动产生的，不能因未选分区而失败）
    copyright: 1 # 1 自制（直播是主播自制内容）

# 支付域（M4-PAY-01，spec §6 / plan §2E）。
# 资质现实：真实支付宝/微信需要支付通道资质，当前不具备 —— 只有 mock 渠道可跑通全链路，
# alipay/wechat 为换入点（调用返回 92004「渠道未实现」，接入步骤见 internal/module/pay/alipay.go）。
# 可用环境变量覆盖：DLIDLI_PAY_ORDERTIMEOUTMINUTES / DLIDLI_PAY_STUCKHOURS /
# DLIDLI_PAY_MOCKSECRET / DLIDLI_PAY_MAXAMOUNT / DLIDLI_PAY_NOTIFYURLBASE
pay:
  orderTimeoutMinutes: 15 # 订单支付超时（分钟）；过期由惰性关单置为「已关闭」
  stuckHours: 24 # 对账「长期挂起」阈值（小时）
  # dev 固定 mock 密钥（回调验签 HMAC-SHA256）；prod 必须用环境变量注入，否则启动即失败
  mockSecret: dev-mock-pay-secret-do-not-use-in-prod
  maxAmount: 1000000 # 单笔上限（分，即 1 万元）；防把「元」当「分」误传
  notifyURLBase: http://localhost:8000 # 渠道异步回调地址前缀

# 会员域（M4-VIP-01，spec §2.1/§2.2 / plan §2F）。
# 连续包月的真实「免密代扣」同样需要支付通道资质，当前不具备 —— 自动续期走 mock 渠道
# （建订单 + mock 渠道回调，与用户手动支付同一条链），真实代扣为换入点（见 vip/service.go mockCharge）。
# 可用环境变量覆盖：DLIDLI_VIP_RENEWENABLED / DLIDLI_VIP_RENEWINTERVALSECONDS /
# DLIDLI_VIP_RENEWBATCHSIZE / DLIDLI_VIP_MAXFAILCOUNT / DLIDLI_VIP_COINPERMONTH /
# DLIDLI_VIP_EXPIREREMINDDAYS
vip:
  renewEnabled: false # dev 默认关闭（与 live.audit.enabled 同口径：周期任务不干扰其它测试）
  renewIntervalSeconds: 60 # 续期扫描周期（秒）
  renewBatchSize: 100 # 单轮扫描签约数上限（限流）
  maxFailCount: 3 # 连续扣款失败达此数自动解约
  coinPerMonth: 5 # 会员每月赠币枚数（spec §2.1 硬要求：5 枚）
  expireRemindDays: 3 # 到期前提醒天数（spec VIP-04：3 天）

# 充电/分成/提现（M4-PAY-02，spec CHG-01/02/03 + creator spec CRT-31/32 / plan §2H）。
# 资质现实：真实出款（打款到支付宝/银行卡）与真实渠道收款一样需要支付通道资质，
# 当前不具备 —— 打款走 mock 通道，但状态机/冻结扣减/打款幂等全部按真实契约实现；
# 真实出款接口为换入点（见 internal/module/charge/repo.go PayoutWithdrawTx）。
# 可用环境变量覆盖：DLIDLI_CHARGE_MINWITHDRAWAMOUNT / DLIDLI_CHARGE_MAXWITHDRAWPERDAY /
# DLIDLI_CHARGE_SETTLEENABLED / DLIDLI_CHARGE_SETTLEINTERVALSECONDS / DLIDLI_CHARGE_SETTLEDAY
charge:
  minWithdrawAmount: 10000 # 最低提现额（分，即 100 元）：低于此额度出款成本占比过高
  maxWithdrawPerDay: 3 # 24h 内提现申请次数上限：提现是人工审核环节，限制试错与刷单
  settleEnabled: false # 月度结算 Worker（dev 默认关闭，同 vip.renewEnabled 口径）
  settleIntervalSeconds: 3600 # 结算扫描周期（秒）
  settleDay: 1 # 每月 1 号结算上一自然月

