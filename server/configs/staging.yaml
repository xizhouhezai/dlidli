app:
  name: dlidli-api
  env: staging
  port: 8100
  # staging 环境自动过审，便于联调演示（生产仍走人工审核）
  autoApprove: true
  # 内测邀请码注册开关（ACC-44；staging 内测可开）
  inviteCodeRequired: false
  allowOrigins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:5175

log:
  level: info

# staging 独立数据库（与 dev 隔离），部署脚本自动创建
mysql:
  dsn: "root:root@tcp(127.0.0.1:3307)/dlidli_staging?charset=utf8mb4&parseTime=True&loc=Local"
  maxOpenConns: 50
  maxIdleConns: 10

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 1 # staging 独立 db，与 dev(0) 隔离

jwt:
  # 生产环境必须通过环境变量 DLIDLI_JWT_SECRET 覆盖
  secret: "staging-secret-do-not-use-in-prod"
  accessTtlMin: 120

ratelimit:
  enabled: true
  perMinute: 30

storage:
  driver: local
  localDir: ./uploads_staging
  baseUrl: http://localhost:8100/static

transcode:
  enabled: true
  workers: 1
  # ffmpeg/ffprobe 缺省走 PATH；特殊环境用环境变量覆盖：
  #   DLIDLI_TRANSCODE_FFMPEGPATH / DLIDLI_TRANSCODE_FFPROBEPATH

# 直播域（M4-LIV-01）：推拉流寻址 + SRS 回调鉴权；宿主/端口按 staging 实际部署改。
# 可用环境变量覆盖：DLIDLI_LIVE_PUSHDOMAIN / DLIDLI_LIVE_PLAYDOMAIN /
# DLIDLI_LIVE_STREAMAPP / DLIDLI_LIVE_CALLBACKTOKEN
live:
  pushDomain: 127.0.0.1:1935
  playDomain: 127.0.0.1:8180 # SRS 的 http_server 端口（避开 API 8100 与前端 517x）
  streamApp: live
  callbackToken: "" # 必填：用 DLIDLI_LIVE_CALLBACKTOKEN 注入；为空则回调一律拒绝

# OpenTelemetry（M3-ENG-04）：部署时通过 DLIDLI_TRACING_ENDPOINT 启用 OTLP/HTTP。
# tracing:
#   endpoint: http://otel-collector:4318
#   serviceName: dlidli-api

