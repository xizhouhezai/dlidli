# API Deployment + Service（M3-ENG-02）
#
# 探针分工（重要）：
#   - /livez  为存活探针：只表示"进程还能服务"，恒 200，失败才重启；
#   - /health 为就绪探针：依赖（MySQL/Redis）不可用时返回 503，此时摘除 Endpoint 但不重启。
# 不能用 /health 当存活探针：依赖抖动会被误判为进程死亡，导致 Pod 反复重启（雪崩）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlidli-api
  namespace: dlidli
  labels:
    app.kubernetes.io/name: dlidli
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dlidli
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dlidli
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: dlidli/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: dlidli-api-config
            - secretRef:
                name: dlidli-api-secret
          # 依赖未就绪时允许更长启动时间（避免依赖慢启动被判死）
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪探针要求业务依赖可用（/health 依赖不可用时 503）
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # 本地存储驱动需写 uploads（生产应改对象存储）
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: dlidli-api
  namespace: dlidli
  labels:
    app.kubernetes.io/name: dlidli
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dlidli
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
