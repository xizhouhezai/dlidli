# 敏感配置（M3-ENG-02）。
#
# 注意：本文件的 stringData 仅为**本地 kind/单机验证**可用的占位值，
# 生产环境必须改用 External Secrets / Sealed Secrets / 云 KMS 注入，
# 严禁把真实 Secret 提交到仓库（见 docs/project/conventions.md）。
#
# 生成真实 Secret 的推荐做法：
#   kubectl -n dlidli create secret generic dlidli-api-secret \
#     --from-literal=DLIDLI_MYSQL_DSN='...' \
#     --from-literal=DLIDLI_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DLIDLI_WECHAT_MPAPPSECRET='...' \
#     --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: dlidli-api-secret
  namespace: dlidli
  labels:
    app.kubernetes.io/name: dlidli
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # 本地验证占位值：与 deploy/docker-compose.yaml 的 MySQL 口令一致
  DLIDLI_MYSQL_DSN: "root:dlidli123@tcp(dlidli-mysql:3306)/dlidli?charset=utf8mb4&parseTime=True&loc=Local"
  # 06-data.yaml 的 MySQL 容器初始化口令（与上面 DSN 中的口令必须一致）
  DLIDLI_MYSQL_ROOT_PASSWORD: "dlidli123"
  # 生产必须替换：dev 默认值仅供本地
  DLIDLI_JWT_SECRET: "dev-secret-do-not-use-in-prod"
  # 小程序 Secret 需由微信公众平台获取后注入，仓库中留空（M3-MP-01 未配置时优雅降级）
  DLIDLI_WECHAT_MPAPPSECRET: ""
