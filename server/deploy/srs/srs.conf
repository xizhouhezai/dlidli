# =============================================================================
# DliDli 直播服务器（SRS 5）配置 —— 模块 M4-LIV-01 / WP-C
#
# 用途：接收主播 RTMP 推流（OBS / FFmpeg），转出 HLS 与 HTTP-FLV 供 Web/H5 播放，
#       并通过 HTTP 回调把「开播 / 下播」事件交给后端鉴权与状态联动。
#
# 寻址口径（与后端契约严格对齐，详见 docs/project/deployment.md §5.5）：
#   推流  rtmp://<host>:1935/live/room_<roomId>?key=<streamKey>
#   拉流  http://<host>:8180/live/room_<roomId>.m3u8
#         http://<host>:8180/live/room_<roomId>.flv
#   app   = live（后端 live.streamApp；由推流 URL 路径段决定，SRS 5 无需声明）
#   流名  = room_<roomId>（公开，不含密钥；密钥只走推流 URL 查询串）
#
# 校验说明（2026-10-13 实测修订）：本文件此前从未被真正加载（compose 未指定 command，
#   SRS 一直读镜像内置 conf/docker.conf），因此下述三处会被 SRS 5 解析器拒绝的写法长期未暴露：
#     ① `app live { }` 块 → SRS 3/4 旧语法，5.x 解析失败（改用 URL 路径段，无需声明）
#     ② http_hooks URL 里的 ${SRS_CALLBACK_TOKEN} → 花括号被当作块开括号（改用 $SRS_CALLBACK_TOKEN）
#     ③ 文件尾部的 env 指令 → 5.x 要求 env 位于其他指令之前（已上移至顶部）
#   验证命令：docker run --rm -v <此文件>:/tmp/t.conf:ro ossrs/srs:5 sh -c "./objs/srs -t -c /tmp/t.conf"
# =============================================================================

# 环境变量：回调 token 与后端 live.callbackToken 必须一致
#   - 与 server/configs/dev.yaml 的 live.callbackToken 对齐（该键由 WP-A 加入）
#   - **不要写 `env XXX=...;` 指令**：SRS 5 的 conf 不支持 env 指令（写它会报 illegal directive env），
#     变量直接取自**进程环境**（镜像 conf 里 `candidate $CANDIDATE;` 即此用法）。
#     本配置的 token 由 docker-compose.srs.yaml 的 `environment: SRS_CALLBACK_TOKEN=...` 注入。
#   - 生产环境请勿沿用 dev 默认值：换成随机密钥，后端侧用同名环境变量
#     （如 DLIDLI_LIVE_CALLBACKTOKEN）注入同一值

# -----------------------------------------------------------------------------
# 全局
# -----------------------------------------------------------------------------
listen              1935;        # RTMP 收流入口（OBS 默认协议）
max_connections     1000;        # 单机并发上限，按需要放大
daemon              off;         # 容器内必须前台运行（PID 1，docker stop 才能优雅退出）
srs_log_tank        console;     # 日志打到 stdout/stderr，交由 docker logs 收集

http_api {                       # SRS HTTP API：查流、踢流、观测
    enabled         on;
    listen          1985;        # 内网运维端口，勿对公网开放
    crossdomain     on;
}

http_server {                    # SRS 内建 HTTP 服务：HLS 切片 + HTTP-FLV 挂载点
    enabled         on;
    listen          8180;        # 刻意避开 8080：本机 8080 已被出站连接占用/易与外部代理冲突
    dir             ./objs/nginx/html;
    crossdomain     on;          # 允许播放器跨域拉取 m3u8/ts/flv
}

# -----------------------------------------------------------------------------
# 默认 vhost
# -----------------------------------------------------------------------------
vhost __defaultVhost__ {

    # ---- 应用名：D1 约定 app = live ---------------------------------------
    # 推流 rtmp://<host>:1935/live/room_<id>?key=<streamKey>
    # 拉流 http://<host>:8180/live/room_<id>.m3u8 | .flv
    # 注意：HTTP-FLV 的 mount 用了 [app] 变量，必须与后端 live.streamApp 同名（live）。
    # SRS 5 无需在此声明 app：流的 app 直接取自推流 URL 的路径段（rtmp://host/live/room_<id> 的 live）。
    # SRS 3/4 的 `app xxx { }` 块在 5.x 已不被解析器接受——写成 app 块会让整个配置解析失败
    #（`unexpected end of file, expecting "}"`）；`default_app` 也不是全局/vhost 指令（它只属于 srt_server 块）。
    # 两处都于 2026-10-13 实测踩到（此前配置从未真正加载，故该缺陷长期未被发现）。

    # ---- HTTP 回调：推流鉴权与下播联动（后端契约 D2/D3）--------------------
    # 后端按「共享 token（常量时间比较）+ 房间存在 + bcrypt 校验 param.key +
    # 房间状态=直播中」四项判定，非 2xx 一律拒绝推流。
    # SRS 把推流 URL 查询串解析进回调体的 param 字段（?key=<streamKey> 即由此抵达后端）。
    http_hooks {
        enabled         on;
        # 开播：后端校验通过才放行；?key=<streamKey> 由 SRS 放入 param
        # ⚠️ token 必须写**字面值**：SRS 的 conf 变量展开只对少数内置指令生效（如 rtc_server.candidate），
        #    http_hooks 的 URL **不做环境变量替换**——写 $SRS_CALLBACK_TOKEN 会把字面量发给后端，
        #    后端常量时间比较必然失败（403 / 91024，2026-10-13 实测）。
        #    改 token 时须同时改这里与 server/configs/dev.yaml 的 live.callbackToken。
        on_publish      http://host.docker.internal:8000/api/v1/live/stream/auth?token=dev-live-cb-token;
        # 下播：主通道（确定性，无轮询开销），后端据此把房间状态置为「已下播」
        on_unpublish    http://host.docker.internal:8000/api/v1/live/stream/stop?token=dev-live-cb-token;
    }

    # ---- HTTP-FLV 转封装：http://<host>:8180/live/room_<id>.flv ------------
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        hstrs       on;          # HTTP TS 服务同步开启
    }

    # ---- HLS：http://<host>:8180/live/room_<id>.m3u8 ----------------------
    hls {
        enabled         on;
        hls_fragment    2;       # 单片 2s（spec §5 目标延迟 6–15s 的下限来源）
        hls_window      8;       # 保留 8 片 = 16s 窗口（需 >= 窗口内 ts 总时长）
        # ⚠️ hls_path 必须在 http_server.dir 之内：SRS 的 HTTP 服务只从 dir 提供文件，
        #    写到 dir 之外（如本文件原用的 /data/streams）时切片存在但 8180 一律 404（2026-10-13 实测）。
        #    这里显式对齐 http_server.dir = ./objs/nginx/html。
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;   # -> 8180/live/room_<id>.m3u8
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_wait_keyframe on;    # 每片以关键帧起头，符合 HLS 规范（+1 个 GOP 的切片延迟）
        # 注：SRS 5 的 hls 块**没有** hls_https / hls_fragment_naming 指令（写它们会被
        # ConfigInvalid 拒绝）。HLS 经内建 http_server 明文直出，TLS 由上层反向代理终结；
        # ts 命名用默认（hls_ts_file 的 [seq]），重推流靠 hls_cleanup + 同一流名覆盖。
        # 2026-10-13 实测：这两个指令名是本文件此前从未被真正加载时遗留的错误。
    }

    # ---- 收流侧优化（低延迟、不做额外存储）-------------------------------
    tcp_nodelay     on;          # 禁用 Nagle，降低推流链路抖动
    play {
        gop_cache   on;          # 新观众先拿 GOP 缓存，首帧更快
        queue_length 10;
    }
    publish {
        mr          off;         # 不启用 MPEG-TS 多路复用拉模式（本场景无需求）
    }

    # ---- DVR / 转码：本卡不做 -------------------------------------------
    # 录制与多码率转码见 PLAN.md D7（演进项），启用前需先评估磁盘与 CPU 预算。
    # dvr { enabled on; dvr_path /data/dvr; }
}

