# DliDli 本地开发环境
# 用法：docker compose -f deploy/docker-compose.yaml up -d
name: dlidli-dev

services:
  mysql:
    image: mysql:8.0
    container_name: dlidli-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dlidli123
      MYSQL_DATABASE: dlidli
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdlidli123"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dlidli-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: dlidli-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft 单节点模式
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka

  minio:
    image: minio/minio:latest
    container_name: dlidli-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    environment:
      MINIO_ROOT_USER: dlidli
      MINIO_ROOT_PASSWORD: dlidli123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 监控（M1-REL-02）：Prometheus 抓取 dlidli-api /metrics，Grafana 自动加载基础面板
  # 访问：http://localhost:9090（Prometheus）/ http://localhost:3000（Grafana admin/admin）
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dlidli-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dlidli-grafana
    ports:
      - "3000:3000"
    environment:
      - GRAFANA_PROM_URL=http://prometheus:9090
      - DLIDLI_DASHBOARDS_PATH=/var/lib/grafana/dashboards
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Elasticsearch 于 M2（搜索）阶段启用
  # elasticsearch:
  #   image: elasticsearch:8.14.0
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #   ports:
  #     - "9200:9200"

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  minio-data:
  prometheus-data:
  grafana-data:
