basePath: /api/v1
definitions:
  github_com_dlidli_server_internal_module_video.SaveCategoryReq:
    properties:
      name:
        maxLength: 32
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  github_com_dlidli_server_internal_pkg_response.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      trace_id:
        type: string
    type: object
  internal_module_account.UpdateProfileReq:
    properties:
      gender:
        type: integer
      nickname:
        type: string
      signature:
        type: string
    type: object
  internal_module_admin.AddWordReq:
    properties:
      word:
        maxLength: 64
        type: string
    required:
    - word
    type: object
  internal_module_admin.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_module_admin.PunishReq:
    properties:
      action:
        description: 处罚动作
        enum:
        - mute
        - unmute
        - ban
        - unban
        type: string
      days:
        description: 处罚天数（ban 传 0=永久）
        maximum: 3650
        minimum: 0
        type: integer
      reason:
        description: 处罚原因（审计留痕）
        maxLength: 200
        type: string
    required:
    - action
    type: object
  internal_module_admin.ResetPwdReq:
    properties:
      password:
        maxLength: 64
        minLength: 6
        type: string
    required:
    - password
    type: object
  internal_module_admin.ReviewReq:
    properties:
      approve:
        type: boolean
      reason:
        type: string
    type: object
  internal_module_admin.SaveAdminReq:
    properties:
      nickname:
        maxLength: 32
        type: string
      password:
        maxLength: 64
        type: string
      role_ids:
        description: 雪花 ID 字符串化（防 JS 精度丢失）
        items:
          type: string
        type: array
      username:
        maxLength: 32
        type: string
    required:
    - username
    type: object
  internal_module_admin.SaveRoleReq:
    properties:
      code:
        maxLength: 32
        type: string
      name:
        maxLength: 32
        type: string
      perms:
        items:
          type: string
        type: array
      remark:
        maxLength: 128
        type: string
    required:
    - name
    type: object
  internal_module_interaction.AddCommentReq:
    properties:
      content:
        maxLength: 1000
        type: string
      parent_id:
        type: string
      root_id:
        type: string
    required:
    - content
    type: object
  internal_module_video.SubmitReq:
    properties:
      category_id:
        type: integer
      copyright:
        description: 1自制 2转载
        enum:
        - 1
        - 2
        type: integer
      cover:
        description: 可选，封面 URL
        type: string
      description:
        maxLength: 2000
        type: string
      file_id:
        type: string
      tags:
        items:
          type: string
        maxItems: 10
        minItems: 1
        type: array
      title:
        maxLength: 80
        type: string
    required:
    - category_id
    - copyright
    - file_id
    - tags
    - title
    type: object
info:
  contact: {}
  description: DliDli 视频社区后端 API（C 端 + 管理后台）。统一响应：{ code, message, data, trace_id
    }，code=0 为成功。
  title: DliDli API
  version: 0.1.0
paths:
  /admin/admins:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 管理员账号列表
      tags:
      - 管理后台-RBAC
    post:
      consumes:
      - application/json
      parameters:
      - description: username; nickname; password; role_ids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.SaveAdminReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 新建管理员账号
      tags:
      - 管理后台-RBAC
  /admin/admins/{id}:
    delete:
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 删除管理员账号
      tags:
      - 管理后台-RBAC
    put:
      consumes:
      - application/json
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      - description: nickname; role_ids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.SaveAdminReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 编辑管理员账号
      tags:
      - 管理后台-RBAC
  /admin/admins/{id}/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      - description: password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.ResetPwdReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 重置账号密码
      tags:
      - 管理后台-RBAC
  /admin/admins/{id}/toggle:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      - description: 'status: 0启用/1停用'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 启用/停用账号
      tags:
      - 管理后台-RBAC
  /admin/categories:
    get:
