basePath: /api/v1
definitions:
  github_com_dlidli_server_internal_module_video.SaveCategoryReq:
    properties:
      name:
        maxLength: 32
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  github_com_dlidli_server_internal_pkg_response.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      trace_id:
        type: string
    type: object
  internal_module_abtest.SaveReq:
    properties:
      name:
        maxLength: 64
        type: string
      ratio:
        maximum: 100
        minimum: 0
        type: integer
      remark:
        maxLength: 200
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
      target:
        maxLength: 32
        type: string
      variant_a:
        maxLength: 64
        type: string
      variant_b:
        maxLength: 64
        type: string
    required:
    - name
    - target
    - variant_a
    - variant_b
    type: object
  internal_module_account.UpdateProfileReq:
    properties:
      gender:
        type: integer
      nickname:
        type: string
      signature:
        type: string
    type: object
  internal_module_admin.AddWordReq:
    properties:
      word:
        maxLength: 64
        type: string
    required:
    - word
    type: object
  internal_module_admin.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_module_admin.PunishReq:
    properties:
      action:
        description: 处罚动作
        enum:
        - mute
        - unmute
        - ban
        - unban
        type: string
      days:
        description: 处罚天数（ban 传 0=永久）
        maximum: 3650
        minimum: 0
        type: integer
      reason:
        description: 处罚原因（审计留痕）
        maxLength: 200
        type: string
    required:
    - action
    type: object
  internal_module_admin.ResetPwdReq:
    properties:
      password:
        maxLength: 64
        minLength: 6
        type: string
    required:
    - password
    type: object
  internal_module_admin.ReviewReq:
    properties:
      approve:
        type: boolean
      reason:
        type: string
    type: object
  internal_module_admin.SaveAdminReq:
    properties:
      nickname:
        maxLength: 32
        type: string
      password:
        maxLength: 64
        type: string
      role_ids:
        description: 雪花 ID 字符串化（防 JS 精度丢失）
        items:
          type: string
        type: array
      username:
        maxLength: 32
        type: string
    required:
    - username
    type: object
  internal_module_admin.SaveConfigReq:
    properties:
      config_key:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        type: string
      remark:
        maxLength: 200
        type: string
      value:
        maxLength: 500
        type: string
    required:
    - config_key
    type: object
  internal_module_admin.SaveDictReq:
    properties:
      dict_type:
        maxLength: 32
        type: string
      label:
        maxLength: 64
        type: string
      remark:
        maxLength: 200
        type: string
      sort:
        type: integer
      value:
        maxLength: 64
        type: string
    required:
    - dict_type
    - label
    - value
    type: object
  internal_module_admin.SavePermissionReq:
    properties:
      code:
        maxLength: 64
        type: string
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        type: string
      parent:
        maxLength: 64
        type: string
      path:
        maxLength: 128
        type: string
      sort:
        type: integer
      type:
        enum:
        - menu
        - button
        type: string
    required:
    - name
    type: object
  internal_module_admin.SaveRoleReq:
    properties:
      code:
        maxLength: 32
        type: string
      name:
        maxLength: 32
        type: string
      perms:
        items:
          type: string
        type: array
      remark:
        maxLength: 128
        type: string
    required:
    - name
    type: object
  internal_module_banner.SaveReq:
    properties:
      bvid:
        maxLength: 16
        type: string
      image:
        maxLength: 255
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
      title:
        maxLength: 64
        type: string
    type: object
  internal_module_collection.CreateReq:
    properties:
      cover:
        maxLength: 255
        type: string
      description:
        maxLength: 200
        type: string
      title:
        maxLength: 64
        type: string
    required:
    - title
    type: object
  internal_module_im.SendReq:
    properties:
      content:
        type: string
      content_type:
        description: 1文字 2图片
        enum:
        - 1
        - 2
        type: integer
      to_uid:
        type: string
    required:
    - content
    - to_uid
    type: object
  internal_module_interaction.AddCommentReq:
    properties:
      content:
        maxLength: 1000
        type: string
      parent_id:
        type: string
      root_id:
        type: string
    required:
    - content
    type: object
  internal_module_live.ApplyResult:
    properties:
      push_url:
        type: string
      room:
        $ref: '#/definitions/internal_module_live.RoomInfo'
      stream_key:
        description: 明文密钥仅申请/重置时返回
        type: string
    type: object
  internal_module_live.DanmakuInfo:
    properties:
      avatar:
        type: string
      content:
        type: string
      id:
        example: "0"
        type: string
      nickname:
        type: string
      user_id:
        description: 已是十进制字符串（itoa），不再二次转字符串
        type: string
    type: object
  internal_module_live.HistoryResult:
    properties:
      list:
        items:
          $ref: '#/definitions/internal_module_live.DanmakuInfo'
        type: array
      online:
        type: integer
      room_id:
        type: integer
    type: object
  internal_module_live.RoomInfo:
    properties:
      anchor_id:
        description: 字符串避免 JS 精度丢失
        type: string
      category_id:
        type: integer
      cover:
        type: string
      ended_at:
        type: string
      id:
        type: integer
      online:
        type: integer
      started_at:
        type: string
      status:
        type: integer
      title:
        type: string
    type: object
  internal_module_live.RoomListResult:
    properties:
      list:
        items:
          $ref: '#/definitions/internal_module_live.RoomInfo'
        type: array
      total:
        type: integer
    type: object
  internal_module_live.muteReq:
    properties:
      minutes:
        description: 禁言分钟数，1 ~ 43200
        type: integer
      reason:
        type: string
    required:
    - minutes
    type: object
  internal_module_live.updateRoomReq:
    properties:
      category_id:
        type: integer
      cover:
        type: string
      title:
        type: string
    required:
    - category_id
    - title
    type: object
  internal_module_report.HandleReq:
    properties:
      action:
        description: 忽略/删除内容/删除并处罚
        enum:
        - ignore
        - delete
        - punish
        type: string
      days:
        description: 处罚天数（ban 传 0 = 永久）
        type: integer
      note:
        description: 处理备注
        maxLength: 255
        type: string
      punish:
        description: punish 时的处罚类型
        enum:
        - mute
        - ban
        type: string
    required:
    - action
    type: object
  internal_module_report.SubmitReq:
    properties:
      reason:
        maxLength: 500
        type: string
      reason_type:
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        type: integer
      target_id:
        description: 视频传 bvid，其余传对象 ID（字符串）
        type: string
      target_type:
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        type: integer
    required:
    - reason_type
    - target_id
    - target_type
    type: object
  internal_module_video.PartSubmit:
    properties:
      file_id:
        type: string
      title:
        maxLength: 80
        type: string
    required:
    - file_id
    type: object
  internal_module_video.SubmitReq:
    properties:
      category_id:
        type: integer
      copyright:
        description: 1自制 2转载
        enum:
        - 1
        - 2
        type: integer
      cover:
        description: 可选，封面 URL
        type: string
      description:
        maxLength: 2000
        type: string
      file_id:
        type: string
      parts:
        description: 多P投稿（PRD VID-05）：每项对应一个分P（file_id + 分P标题）；空则单P兼容现状
        items:
          $ref: '#/definitions/internal_module_video.PartSubmit'
        type: array
      tags:
        items:
          type: string
        maxItems: 10
        minItems: 1
        type: array
      title:
        maxLength: 80
        type: string
    required:
    - category_id
    - copyright
    - file_id
    - tags
    - title
    type: object
info:
  contact: {}
  description: DliDli 视频社区后端 API（C 端 + 管理后台）。统一响应：{ code, message, data, trace_id
    }，code=0 为成功。
  title: DliDli API
  version: 0.1.0
paths:
  /admin/admins:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 管理员账号列表
      tags:
      - 管理后台-RBAC
    post:
      consumes:
      - application/json
      parameters:
      - description: username; nickname; password; role_ids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.SaveAdminReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 新建管理员账号
      tags:
      - 管理后台-RBAC
  /admin/admins/{id}:
    delete:
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 删除管理员账号
      tags:
      - 管理后台-RBAC
    put:
      consumes:
      - application/json
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      - description: nickname; role_ids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.SaveAdminReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 编辑管理员账号
      tags:
      - 管理后台-RBAC
  /admin/admins/{id}/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      - description: password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.ResetPwdReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 重置账号密码
      tags:
      - 管理后台-RBAC
  /admin/admins/{id}/toggle:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      - description: 'status: 0启用/1停用'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 启用/停用账号
      tags:
      - 管理后台-RBAC
  /admin/audit-logs:
    get:
      parameters:
      - description: 操作者ID
        in: query
        name: admin_id
        type: integer
      - description: 动作
        in: query
        name: action
        type: string
      - description: 对象类型
        in: query
        name: obj_type
        type: string
      - description: 起始日期 YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: 截止日期 YYYY-MM-DD
        in: query
        name: to
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 审计日志分页查询（按操作者/动作/对象/时间筛选）
      tags:
      - 管理后台-审计
  /admin/audit-logs/export:
    get:
      parameters:
      - description: 操作者ID
        in: query
        name: admin_id
        type: integer
      - description: 动作
        in: query
        name: action
        type: string
      - description: 对象类型
        in: query
        name: obj_type
        type: string
      - description: 起始日期 YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: 截止日期 YYYY-MM-DD
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV 文件
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 审计日志导出 CSV（按当前筛选条件）
      tags:
      - 管理后台-审计
  /admin/banners:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: Banner 列表（admin）
      tags:
      - 管理后台-运营
    post:
      consumes:
      - application/json
      parameters:
      - description: Banner 信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_banner.SaveReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 新建 Banner
      tags:
      - 管理后台-运营
  /admin/banners/{id}:
    delete:
      parameters:
      - description: Banner ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 删除 Banner
      tags:
      - 管理后台-运营
    put:
      consumes:
      - application/json
      parameters:
      - description: Banner ID
        in: path
        name: id
        required: true
        type: integer
      - description: Banner 信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_banner.SaveReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 编辑 Banner
      tags:
      - 管理后台-运营
  /admin/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 分区列表（含停用）
      tags:
      - 管理后台-分区
    post:
      consumes:
      - application/json
      parameters:
      - description: parent_id; name; sort; status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_dlidli_server_internal_module_video.SaveCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 新建分区
      tags:
      - 管理后台-分区
  /admin/categories/{id}:
    delete:
      parameters:
      - description: 分区ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 删除分区（有子分区或稿件时禁删）
      tags:
      - 管理后台-分区
    put:
      consumes:
      - application/json
      parameters:
      - description: 分区ID
        in: path
        name: id
        required: true
        type: integer
      - description: name; sort; status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_dlidli_server_internal_module_video.SaveCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 编辑分区
      tags:
      - 管理后台-分区
  /admin/configs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 系统配置列表
      tags:
      - 管理后台-系统
    post:
      consumes:
      - application/json
      parameters:
      - description: 配置项
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.SaveConfigReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 新建系统配置
      tags:
      - 管理后台-系统
  /admin/configs/{id}:
    delete:
      parameters:
      - description: 配置ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 删除系统配置
      tags:
      - 管理后台-系统
    put:
      consumes:
      - application/json
      parameters:
      - description: 配置ID
        in: path
        name: id
        required: true
        type: integer
      - description: 配置项
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.SaveConfigReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 编辑系统配置（热更新）
      tags:
      - 管理后台-系统
  /admin/dashboard/stats:
    get:
      consumes:
      - application/json
      parameters:
      - description: count; expire_days(0=永久)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 生成内测邀请码
      tags:
      - 管理后台-概览
      - 管理后台-运营
  /admin/dicts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 数据字典分组列表
      tags:
      - 管理后台-系统
    post:
      consumes:
      - application/json
      parameters:
      - description: 字典项
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.SaveDictReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 新建字典项
      tags:
      - 管理后台-系统
  /admin/dicts/{id}:
    delete:
      parameters:
      - description: 字典项ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dlidli_server_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 删除字典项
      tags:
      - 管理后台-系统
    put:
