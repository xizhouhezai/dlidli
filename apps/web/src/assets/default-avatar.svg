<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- DliDli 默认头像：品牌粉渐变圆底 + 电视机吉祥物（与默认封面视觉同源） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7299"/>
      <stop offset="1" stop-color="#fc9db8"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- 渐变底 -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- 背景光斑点缀 -->
    <circle cx="90" cy="90" r="70" fill="#ffffff" opacity="0.10"/>
    <circle cx="440" cy="150" r="46" fill="#ffffff" opacity="0.10"/>
    <circle cx="410" cy="430" r="80" fill="#ffffff" opacity="0.08"/>

    <!-- 电视机吉祥物 -->
    <g transform="translate(256 276)">
      <!-- 天线 -->
      <path d="M-62 -142 L-16 -88 M62 -142 L16 -88" stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none"/>
      <circle cx="-62" cy="-142" r="16" fill="#ffffff"/>
      <circle cx="62" cy="-142" r="16" fill="#ffffff"/>
      <!-- 机身 -->
      <rect x="-150" y="-88" width="300" height="220" rx="52" fill="#ffffff"/>
      <!-- 屏幕 -->
      <rect x="-122" y="-60" width="244" height="164" rx="36" fill="#fb7299"/>
      <!-- 眼睛 -->
      <circle cx="-52" cy="6" r="17" fill="#ffffff"/>
      <circle cx="52" cy="6" r="17" fill="#ffffff"/>
      <!-- 腮红 -->
      <circle cx="-88" cy="42" r="11" fill="#ffffff" opacity="0.45"/>
      <circle cx="88" cy="42" r="11" fill="#ffffff" opacity="0.45"/>
      <!-- 微笑 -->
      <path d="M-30 46 Q0 70 30 46" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
