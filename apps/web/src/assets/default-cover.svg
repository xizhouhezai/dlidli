<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9e4"/>
      <stop offset="0.55" stop-color="#fb9db8"/>
      <stop offset="1" stop-color="#fb7299"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffeef4"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 漂浮弹幕胶囊 -->
  <g fill="#ffffff" opacity="0.5">
    <rect x="90"  y="130" rx="26" width="300" height="52"/>
    <rect x="1210" y="200" rx="22" width="240" height="44"/>
    <rect x="180" y="780" rx="22" width="260" height="44"/>
    <rect x="1150" y="720" rx="26" width="320" height="52"/>
    <rect x="620" y="90"  rx="18" width="180" height="36"/>
  </g>
  <g fill="#fb7299" opacity="0.35">
    <circle cx="130" cy="156" r="12"/>
    <circle cx="1250" cy="222" r="10"/>
    <circle cx="220" cy="802" r="10"/>
    <circle cx="1190" cy="746" r="12"/>
  </g>

  <!-- 星星点缀 -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M320 320 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z"/>
    <path d="M1300 420 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z"/>
    <path d="M1180 130 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
  </g>

  <!-- 电视机 -->
  <g>
    <!-- 天线 -->
    <g stroke="#5c3a45" stroke-width="14" stroke-linecap="round">
      <line x1="720" y1="330" x2="650" y2="215"/>
      <line x1="880" y1="330" x2="950" y2="215"/>
    </g>
    <circle cx="650" cy="205" r="18" fill="#5c3a45"/>
    <circle cx="950" cy="205" r="18" fill="#5c3a45"/>

    <!-- 机身 -->
    <rect x="560" y="330" width="480" height="360" rx="48" fill="#5c3a45"/>
    <rect x="588" y="358" width="424" height="304" rx="32" fill="url(#screen)"/>

    <!-- 播放按钮 -->
    <circle cx="800" cy="510" r="86" fill="#fb7299"/>
    <path d="M778 468 L850 510 L778 552 Z" fill="#ffffff"/>

    <!-- 腮红 -->
    <ellipse cx="640" cy="600" rx="26" ry="16" fill="#fb7299" opacity="0.45"/>
    <ellipse cx="960" cy="600" rx="26" ry="16" fill="#fb7299" opacity="0.45"/>

    <!-- 支脚 -->
    <rect x="640" y="690" width="44" height="34" rx="12" fill="#5c3a45"/>
    <rect x="916" y="690" width="44" height="34" rx="12" fill="#5c3a45"/>
  </g>

  <!-- 品牌字 -->
  <text x="800" y="860" text-anchor="middle" fill="#ffffff"
        font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="96" font-weight="800" letter-spacing="4">DliDli</text>
</svg>
